<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/globabox-mark.svg" />
    
    <!-- SEO Meta Tags -->
    <title>Globabox Maroc | Boutique en ligne multi-catégories</title>
    <meta name="description" content="Découvrez Globabox Maroc, boutique en ligne de produits du quotidien, maison, accessoires, sport et loisirs. Livraison partout au Maroc, paiement à la livraison, livraison gratuite dès 500 DH." />
    <meta name="keywords" content="Globabox Maroc, boutique en ligne, shopping maroc, accessoires, maison, technologie, sport, paiement à la livraison" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Globabox Maroc" />
    <meta name="geo.region" content="MA" />
    <meta name="geo.placename" content="Morocco" />
    <link rel="canonical" href="https://www.globabox.com" />

    <!-- Open Graph / Social Media Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Globabox Maroc | Shopping en ligne au Maroc" />
    <meta property="og:description" content="Découvrez GLOBABOX : produits du quotidien, accessoires, maison, technologie et loisirs. Commandez avec paiement à la livraison." />
    <meta property="og:url" content="https://www.globabox.com" />
    <meta property="og:site_name" content="Globabox" />

    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Globabox Maroc | Shopping en ligne" />
    <meta name="twitter:description" content="Équipement camping, outdoor et voyage au Maroc. Livraison partout au Maroc, paiement à la livraison." />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- Google Structured Schema Markup (JSON-LD) for Local Store / E-Commerce -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "Globabox",
        "url": "https://www.globabox.com",
        "telephone": "+212649264408",
        "priceRange": "MAD",
        "paymentAccepted": "Cash on delivery",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "Morocco"
        },
        "shippingDetails": {
          "@type": "ShippingRateSettings",
          "shippingDestination": {
            "@type": "DefinedRegion",
            "addressCountry": "Morocco"
          }
        },
        "description": "Boutique en ligne multi-catégories pour la maison, les accessoires et le quotidien au Maroc."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
